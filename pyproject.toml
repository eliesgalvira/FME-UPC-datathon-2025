[project]
name = "fme-upc-datathon-2025"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"pandas>=2.2",
	"numpy>=1.26",
	"dask[dataframe]>=2024.4",
	"pyarrow>=15.0",
	"scikit-learn>=1.4",
	"lightgbm>=4.2",
	"torch>=2.2",
	"category-encoders>=2.6",
	"pyyaml>=6.0",
	"click>=8.1",
	"streamlit>=1.34",
	"plotly>=5.20",
]

[project.optional-dependencies]
dev = [
	"ipykernel>=6.29",
	"jupyterlab>=4.2",
	"pytest>=8.2",
	"ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
